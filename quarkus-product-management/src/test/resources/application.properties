# Test configuration for H2 database
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.reactive.url=mem:testdb

# Hibernate configuration for tests
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Disable Swagger UI for tests
quarkus.swagger-ui.always-include=false

# Test logging
quarkus.log.level=WARN
quarkus.log.category."com.example.productmanagement".level=DEBUG

# HTTP configuration for tests
quarkus.http.test-port=8081
